services:
  # Reads the NPM access logs (read-only) and writes the figures and settings to ./data.
  # Settings are made on the settings page (data/config.yaml). Only the log folder is set here, via .env.
  # No login of its own: only run it in the LAN, e.g. behind an NPM proxy host with an access list.
  npmcountdy:
    build: .
    image: npmcountdy:local
    container_name: npmcountdy
    restart: unless-stopped
    ports:
      - "7881:7881"
    environment:
      TZ: Europe/Berlin                       # default, can be changed on the settings page
      CLEAR: "${CLEAR:-on}"                   # allow deleting a domain's data in the UI
      LOG_SOURCE: "${NPM_LOGS:-/opt/data/logs}"  # only shown on the settings page
    volumes:
      - ${NPM_LOGS:-/opt/data/logs}:/logs:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
