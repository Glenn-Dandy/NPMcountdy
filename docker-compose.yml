services:
  # Liest die Access-Logs des NPM nur mit (read-only) und schreibt die Zahlen in ./data.
  # Keine eigene Anmeldung: nur im LAN betreiben, z. B. hinter einem NPM-Host mit Access List.
  npmcountdy:
    build: .
    image: npmcountdy:local
    container_name: npmcountdy
    restart: unless-stopped
    ports:
      - "7881:7881"
    environment:
      TZ: Europe/Berlin
      INTERVAL: "60"       # Sekunden zwischen zwei Einlesevorgängen
      DETAIL_DAYS: "90"    # so lange bleiben Dateien und Besucher-IPs gespeichert
    volumes:
      - ${NPM_LOGS:-/opt/data/logs}:/logs:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
