services:
  npmcountdy:
    image: ghcr.io/glenn-dandy/npmcountdy:latest
    container_name: npmcountdy
    restart: unless-stopped
    ports:
      - "7881:7881"
    environment:
      TZ: Europe/Berlin   # default, can be changed on the settings page
      CLEAR: "on"         # allow deleting a domain's data in the UI ("off" turns it off)
    volumes:
      # NPM log folder on the left. NPM in Docker: /opt/data/logs (its /data volume + /logs),
      # NPM without Docker: /data/logs
      - /opt/data/logs:/logs:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
