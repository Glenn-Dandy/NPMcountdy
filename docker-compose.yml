services:
  # Reads the NPM access logs (read-only) and writes the figures to ./data.
  # No login of its own: only run it in the LAN, e.g. behind an NPM proxy host with an access list.
  npmcountdy:
    build: .
    image: npmcountdy:local
    container_name: npmcountdy
    restart: unless-stopped
    ports:
      - "7881:7881"
    environment:
      TZ: Europe/Berlin
      INTERVAL: "60"       # seconds between two log reads
      DETAIL_DAYS: "90"    # days that files and visitor IPs are kept
      CLEAR: "on"          # allow deleting a domain's data in the UI ("off" disables it)
      GEOIP: "on"          # countries for IPs, downloads the free DB-IP database monthly ("off" disables it)
      ASN: "on"            # providers for IPs, also from DB-IP, monthly ("off" disables it)
      UPDATE_CHECK: "on"   # ask GitHub every 12 hours for a newer version ("off" disables it)
    volumes:
      - ${NPM_LOGS:-/opt/data/logs}:/logs:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
